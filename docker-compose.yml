services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ccms_api
    restart: always
    volumes:
      - ./apps/api/prisma:/app/apps/api/prisma
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=ccms_secret_key_change_in_production

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ccms_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
